  :root {
    /* OAD Corporate Identity 2021 colour palette */
    --navy: #1e3551;
    --sand: #d9b487;
    --yellow: #f9c434;
    --terracotta: #af5a4c;
    --sage: #72896b;
    --teal: #1a524b;

    --deep: #0d1828;                 /* darker navy for the sky */
    --ink: #ffffff;
    --muted: color-mix(in srgb, var(--sand) 80%, white);
    --line: color-mix(in srgb, var(--sand) 55%, transparent);
    --panel: color-mix(in srgb, var(--navy) 92%, black);
    --ps: clamp(70px, 15vmin, 170px);      /* planet size */
    font-family: "DIN 2014", "Barlow", "Bahnschrift", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    color: var(--ink);
    background:
      radial-gradient(ellipse 70% 60% at 50% 52%, color-mix(in srgb, var(--navy) 85%, white) 0%, var(--navy) 35%, transparent 75%),
      linear-gradient(180deg, var(--deep), color-mix(in srgb, var(--navy) 70%, var(--deep)));
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    display: flex; flex-direction: column;
  }
  /* starfield, pure CSS */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .75;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 70%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 55% 15%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 75% 40%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 90% 80%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 20% 90%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 65% 85%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 10%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 45% 45%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 5% 55%, #fff 50%, transparent 51%);
    background-size: 380px 380px;
  }
  /* sky decoration: faint arcs and sparkles */
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #sky .spark { fill: #fff; animation: twinkle 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  #sky .spark:nth-of-type(2n) { animation-delay: -1.7s; }
  #sky .spark:nth-of-type(3n) { animation-delay: -2.9s; }
  @keyframes twinkle { 50% { opacity: .35; transform: scale(.7); } }

  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- header ---------- */
  header {
    position: relative; z-index: 500;   /* above overlays: Home + My flyers always visible */
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 2vmin 3vmin 0;
  }
  .brand { display: flex; align-items: center; gap: 1.4vmin; }
  .brand img { width: clamp(44px, 7vmin, 72px); height: auto; }
  .brand span { font-weight: 600; font-size: clamp(11px, 1.7vmin, 16px); line-height: 1.2; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .titles { text-align: center; }
  .titles h1 { margin: 0; font-weight: 800; font-size: clamp(24px, 5.4vmin, 56px); letter-spacing: .005em; }
  .titles p { margin: .1em 0 0; color: var(--sand); font-weight: 600; font-size: clamp(15px, 2.7vmin, 28px); }
  .hdr-actions { display: flex; gap: 1.5vmin; justify-content: flex-end; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: .5em;
    min-height: 48px; padding: .45em 1.1em; border-radius: 14px;
    border: 2px solid var(--line); background: color-mix(in srgb, var(--navy) 70%, transparent);
    font-size: clamp(15px, 2.3vmin, 24px); font-weight: 700;
    box-shadow: 0 0 0 1px rgb(0 0 0 / .2), 0 4px 14px rgb(0 0 0 / .25);
  }
  .pill svg { width: 1.2em; height: 1.2em; }
  .pill.primary { background: var(--yellow); color: var(--navy); border-color: var(--yellow); }
  .pill:active { transform: scale(.97); }
  .pill[disabled] { opacity: .45; cursor: default; }
  #basketBtn.bump { animation: bump .45s ease; }
  @keyframes bump { 40% { transform: scale(1.15); } }
  #queueBadge { display: none; font-size: 14px; color: var(--muted); }

  /* ---------- orbit stage ---------- */
  #stage {
    position: relative; flex: 1; min-height: 0;
    touch-action: none; cursor: grab; overflow: hidden;
  }
  #stage.dragging { cursor: grabbing; }
  #ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #sun {
    position: absolute; z-index: 50; left: 50%; top: 50%;
    width: calc(var(--ps) * 2); height: calc(var(--ps) * 2);
    transform: translate(-50%, -50%); border-radius: 50%;
    display: grid; place-items: center; pointer-events: none;
    background: radial-gradient(circle, color-mix(in srgb, var(--navy) 70%, white) 0%, color-mix(in srgb, var(--navy) 85%, transparent) 45%, transparent 70%);
    animation: glow 6s ease-in-out infinite;
  }
  #sun img { width: 92%; height: auto; filter: drop-shadow(0 0 10px rgb(255 255 255 / .25)); }
  @keyframes glow { 50% { filter: brightness(1.15); } }

  .planet {
    position: absolute; left: 0; top: 0; border: 0; background: none; padding: 0;
    display: flex; flex-direction: column; align-items: center;
    transform-origin: 50% 50%; will-change: transform, opacity;
    width: calc(var(--ps) * 2.1);
  }
  .globe {
    position: relative; width: var(--ps); height: var(--ps); border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--c) 50%, white) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 45%, black) 100%);
    box-shadow: 0 0 26px 3px color-mix(in srgb, var(--c) 55%, transparent);
    display: grid; place-items: center;
  }
  .globe::before { content: ""; position: absolute; inset: -10%; }
  .globe::after { /* terminator shading */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    box-shadow: inset -16px -20px 30px rgb(0 0 0 / .45), inset 6px 6px 16px rgb(255 255 255 / .18);
  }
  /* surface textures */
  .tex-bands::before { background: repeating-linear-gradient(-14deg, transparent 0 9%, rgb(255 255 255 / .17) 9% 15%, transparent 15% 23%, rgb(0 0 0 / .15) 23% 28%); }
  .tex-craters::before { background:
      radial-gradient(circle at 28% 34%, rgb(0 0 0 / .22) 0 7%, rgb(255 255 255 / .12) 8%, transparent 9.5%),
      radial-gradient(circle at 62% 22%, rgb(0 0 0 / .2) 0 5%, rgb(255 255 255 / .1) 6%, transparent 7.5%),
      radial-gradient(circle at 72% 58%, rgb(0 0 0 / .22) 0 9%, rgb(255 255 255 / .12) 10%, transparent 11.5%),
      radial-gradient(circle at 38% 74%, rgb(0 0 0 / .18) 0 6%, transparent 7.5%),
      radial-gradient(circle at 16% 58%, rgb(0 0 0 / .18) 0 4%, transparent 5.5%); }
  .tex-swirl::before { background:
      radial-gradient(ellipse 55% 16% at 30% 28%, rgb(255 255 255 / .25), transparent 70%),
      radial-gradient(ellipse 45% 14% at 68% 52%, rgb(255 255 255 / .2), transparent 70%),
      radial-gradient(ellipse 50% 14% at 38% 78%, rgb(0 0 0 / .2), transparent 70%),
      radial-gradient(ellipse 35% 10% at 75% 80%, rgb(255 255 255 / .14), transparent 70%); }
  .tex-facets::before { background: conic-gradient(from 20deg at 46% 56%, rgb(255 255 255 / .2) 0 12%, rgb(0 0 0 / .12) 12% 29%, rgb(255 255 255 / .08) 29% 46%, rgb(0 0 0 / .22) 46% 63%, rgb(255 255 255 / .15) 63% 80%, rgb(0 0 0 / .08) 80%); }

  .globe svg { position: relative; z-index: 1; width: 46%; height: 46%; stroke: #fff; fill: rgb(255 255 255 / .18); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .45)); }
  .ink-dark .globe svg, .globe.ink-dark svg { stroke: var(--navy); fill: rgb(30 53 81 / .15); filter: drop-shadow(0 1px 2px rgb(255 255 255 / .4)); }
  .label {
    position: relative; z-index: 2; margin-top: calc(var(--ps) * -0.2);
    padding: .3em .85em; border-radius: 12px; text-align: center; line-height: 1.12;
    font-weight: 700; font-size: clamp(15px, 2.5vmin, 26px);
    color: #fff; text-shadow: 0 1px 2px rgb(0 0 0 / .4);
    background: color-mix(in srgb, var(--c) 55%, var(--deep));
    border: 2px solid color-mix(in srgb, var(--c) 45%, white);
    box-shadow: 0 4px 14px rgb(0 0 0 / .35);
    max-width: 100%;
  }
  .lnk { color: var(--sand); text-decoration: underline dotted; text-underline-offset: 3px; }
  .panel a { color: var(--yellow); }
  /* keep the flyer buttons visible when the text scrolls */
  .panel .actions { position: sticky; bottom: calc(-1 * clamp(18px, 4vmin, 40px)); margin-bottom: calc(-1 * clamp(18px, 4vmin, 40px));
    padding: 2vmin 0 clamp(18px, 4vmin, 40px); background: linear-gradient(transparent, var(--panel) 30%); }
  .support { margin: 1em 0; padding: .8em 1em; border: 2px solid var(--sage); border-radius: 14px; background: color-mix(in srgb, var(--sage) 22%, transparent); }
  .support strong { display: block; font-size: clamp(15px, 2.3vmin, 20px); }
  .support ul { margin: .4em 0 0; }
  .panel h3.gi { margin: 1em 0 .2em; font-size: clamp(16px, 2.5vmin, 22px); color: var(--sand); }
  .label small { display: block; font-size: .68em; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgb(255 255 255 / .85); }
  .planet.front .globe { box-shadow: 0 0 40px 10px color-mix(in srgb, var(--c) 75%, transparent); }
  .planet.front .label { border-color: var(--yellow); }
  .planet:focus-visible { outline: none; }
  .planet:focus-visible .label { outline: 3px solid var(--yellow); }

  .controls {
    position: relative; z-index: 200;
    display: flex; justify-content: center; align-items: center; gap: 3vmin;
    padding: 0 3vmin 2.5vmin;
  }
  .arrow {
    width: 64px; height: 64px; border-radius: 50%; font-size: 34px; line-height: 1;
    border: 2px solid var(--line); background: color-mix(in srgb, var(--navy) 70%, transparent);
  }
  .arrow:active { transform: scale(.94); }
  .hint { color: var(--muted); font-weight: 600; font-size: clamp(14px, 2.2vmin, 20px); text-align: center; min-width: 16em; }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 400; display: none;
    background: rgb(8 14 24 / .72); backdrop-filter: blur(4px);
    align-items: center; justify-content: center; padding: calc(var(--hdr, 90px) + 1vmin) 3vmin 3vmin;
  }
  .overlay.open { display: flex; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } }
  .panel {
    width: min(1000px, 96vw); max-height: 100%; overflow: auto;
    background: var(--panel); border: 2px solid var(--line); border-radius: 22px;
    padding: clamp(18px, 4vmin, 40px);
    box-shadow: 0 20px 60px rgb(0 0 0 / .5);
    user-select: text; -webkit-user-select: text;
    animation: rise .25s ease;
  }
  @keyframes rise { from { transform: translateY(24px); } }
  .panel h2 { margin: 0 0 .2em; font-weight: 800; font-size: clamp(24px, 4.4vmin, 44px); }
  .panel .tag { color: var(--sand); font-weight: 600; margin: 0 0 1em; font-size: clamp(16px, 2.6vmin, 24px); }
  .panel p, .panel li { font-size: clamp(16px, 2.5vmin, 22px); line-height: 1.45; }
  .flyer-grid { display: grid; grid-template-columns: auto 1fr; gap: 4vmin; align-items: start; }
  .flyer-grid .globe { --ps: clamp(110px, 22vmin, 220px); }
  .more { color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 2vmin; margin-top: 3vmin; }
  .actions .pill { font-size: clamp(16px, 2.5vmin, 22px); min-height: 56px; }
  .qr-row { display: flex; gap: 4vmin; align-items: center; margin-top: 1em; }
  .qr {
    width: clamp(140px, 24vmin, 220px); aspect-ratio: 1; border-radius: 12px; background: #fff; color: var(--navy);
    display: grid; place-items: center; text-align: center; font-weight: 700; padding: 10px;
  }
  .qr svg { width: 100%; height: auto; display: block; }
  .qr.small { width: clamp(110px, 17vmin, 170px); padding: 6px; border-radius: 10px; }
  .flyer-side { display: flex; flex-direction: column; align-items: center; gap: 2vmin; }
  .qr-cap { margin: -1vmin 0 0; text-align: center; color: var(--muted); font-size: clamp(13px, 1.9vmin, 16px) !important; line-height: 1.3 !important; }

  .basket-list li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: rgb(255 255 255 / .06); }
  .basket-list .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--c, var(--sand)); flex: none; }

  @media (orientation: portrait) {

    .titles { grid-column: 1 / -1; grid-row: 2; margin-top: 1vmin; }

  }

<body>
<svg id="sky" aria-hidden="true"></svg>

<header>
  <div class="brand"><img class="oad-logo" alt="OAD logo"><span>IAU Office of<br>Astronomy for Development</span></div>
  <div class="titles">
    <h1>Explore our work</h1>
    <p>Tap a planet · swipe to orbit</p>
  </div>
  <div class="hdr-actions">
    <span id="queueBadge" aria-live="polite"></span>
    <button class="pill" id="homeBtn" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>Home
    </button>
    <button class="pill primary" id="basketBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="3" width="13" height="15" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h11"/></svg>
      My flyers: <span id="basketCount">0</span>
    </button>
  </div>
</header>

<main id="stage" aria-label="OAD activities. Use the arrow buttons or swipe to rotate.">
  <svg id="ring" aria-hidden="true"></svg>
  <div id="sun"><img class="oad-logo" alt="Office of Astronomy for Development"></div>
  <!-- planets injected here -->
</main>

<div class="controls">
  <button class="arrow" id="prevBtn" aria-label="Previous activity">‹</button>
  <div class="hint" id="hint" aria-live="polite"></div>
  <button class="arrow" id="nextBtn" aria-label="Next activity">›</button>
</div>

<!-- Flyer overlay -->
<div class="overlay" id="flyerOverlay" role="dialog" aria-modal="true" aria-labelledby="flyerTitle">
  <div class="panel" id="flyerPanel"></div>
</div>

<!-- Basket / email overlay -->
<div class="overlay" id="basketOverlay" role="dialog" aria-modal="true" aria-labelledby="basketTitle">
  <div class="panel">
    <h2 id="basketTitle">Email my flyers</h2>
    <p class="tag">We'll send your chosen flyers in one email.</p>
    <ul class="basket-list" id="basketList"></ul>
    <form id="sendForm" autocomplete="off" novalidate>
      <label class="field" for="email">Your email address</label>
      <input type="email" id="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="name@example.com">
      <input class="hp" type="text" id="website" name="website" tabindex="-1" aria-hidden="true">
      <label class="consent">
        <input type="checkbox" id="consent">
        <span id="consentText"></span>
      </label>
      <div class="error" id="sendError" role="alert"></div>
      <div class="actions">
        <button type="button" class="pill" data-home>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>Home
        </button>
        <button type="submit" class="pill primary" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Send to my email
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Done overlay -->
<div class="overlay" id="doneOverlay" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="panel">
    <h2 id="doneTitle"></h2>
    <p class="tag" id="doneMsg"></p>
    <div id="donePreview"></div>
    <div class="actions">
      <button class="pill primary" data-home>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>Back to start
      </button>
    </div>
  </div>
</div>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
/* [text](url) links inside content. mode: 'a' = clickable, 'span' = text only (kiosk). */
const LINK_RE = /\[([^\]]+)\]\(((?:https?:\/\/|mailto:|tel:)[^)\s]+)\)/g;
const md = (s, mode, style = '') => esc(s).replace(LINK_RE, (_, t, u) => mode === 'a'
  ? `<a href="${u}" target="_blank" rel="noopener"${style ? ` style="${style}"` : ''}>${t}</a>`

/* QR code as inline SVG (works offline). Error correction M; scales with CSS. */
function qrSvg(url) {
  try { const q = qrcode(0, 'M'); q.addData(url); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true, alt: 'QR code: ' + url }); }
  catch (_) { return 'QR code unavailable'; }
}

const stage = $('stage'), ring = $('ring');
const N = ACTIVITIES.length, STEP = (Math.PI * 2) / N, TAU = Math.PI * 2;
let theta = 0;                 // rotation offset (radians); item i sits at angle theta + i*STEP, 0 = front
let geom = { cx: 0, cy: 0, rx: 1, ry: 1 };
let anim = null;               // current rAF id for inertia/snap/attract
const planets = ACTIVITIES.map((a, i) => {
  const el = document.createElement('button');
  el.className = 'planet';
  el.style.setProperty('--c', a.c);
  if (a.ink === 'dark') el.classList.add('ink-dark');
  el.dataset.index = i;
  el.setAttribute('aria-label', a.title);
  el.innerHTML = `<div class="globe tex-${a.tex}">${svgIcon(a.icon)}</div><span class="label">${a.kicker ? `<small>${esc(a.kicker)}</small>` : ''}${esc(a.label)}</span>`;
  // keyboard activation only (pointer taps are handled by the stage)
  el.addEventListener('click', e => { if (e.detail === 0) openFlyer(i); });
  stage.appendChild(el);
  return { el, w: 0, h: 0 };
});

function layout() {
  document.documentElement.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 'px');
  const r = stage.getBoundingClientRect();
  const sample = planets[0].el;
  sample.style.transform = 'none';
  const pw = sample.offsetWidth, ph = sample.offsetHeight;
  const gs = sample.querySelector('.globe').offsetWidth;            // globe diameter (px)
  planets.forEach(p => { p.w = pw; p.h = ph; p.g = gs; p.el.style.transformOrigin = `50% ${gs / 2}px`; });
  const top = gs * 0.6, bottom = (ph - gs / 2) * 1.08 + 4;           // room for globe above, label below
  geom.g = gs;
  geom.cx = r.width / 2;
  geom.rx = Math.max(120, r.width / 2 - pw * 0.5);
  geom.ry = Math.max(60, (r.height - top - bottom) / 2);
  geom.cy = top + geom.ry;
  $('sun').style.top = geom.cy + 'px';
  ring.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`);
  const e = (rx, ry, extra) => `<ellipse cx="${geom.cx}" cy="${geom.cy}" rx="${rx}" ry="${ry}" fill="none" ${extra}/>`;
  ring.innerHTML =
    planets.map((_, i) => `<line id="spoke${i}" stroke="rgba(217,180,135,.5)" stroke-width="1.5"/>`).join('') +
    e(geom.rx, geom.ry, 'stroke="rgba(217,180,135,.14)" stroke-width="10"') +
    e(geom.rx, geom.ry, 'stroke="rgba(217,180,135,.6)" stroke-width="2.5"') +
    e(geom.rx * .55, geom.ry * .55, 'stroke="rgba(217,180,135,.18)" stroke-width="1.5" stroke-dasharray="4 8"');
  planets.forEach((p, i) => { p.spoke = document.getElementById('spoke' + i); });
  drawSky();
  render();
}

/* faint arcs and four-point sparkles, like the mock-up */
function drawSky() {
  const sky = $('sky'), w = innerWidth, h = innerHeight;
  sky.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const spark = (fx, fy, s) => { const x = fx * w, y = fy * h;
    return `<path class="spark" d="M${x} ${y - s}Q${x} ${y} ${x + s} ${y}Q${x} ${y} ${x} ${y + s}Q${x} ${y} ${x - s} ${y}Q${x} ${y} ${x} ${y - s}z"/>`; };
  sky.innerHTML =
    `<path d="M${-w * .05} ${h * .28} Q${w * .1} ${h * .02} ${w * .3} ${-h * .02}" fill="none" stroke="rgba(217,180,135,.18)" stroke-width="1.5"/>` +
    `<path d="M${w * 1.05} ${h * .3} Q${w * .9} ${h * .05} ${w * .72} ${-h * .02}" fill="none" stroke="rgba(217,180,135,.14)" stroke-width="1.5"/>` +
    spark(.19, .12, 11) + spark(.84, .16, 9) + spark(.06, .62, 6) + spark(.93, .55, 7) + spark(.4, .9, 5) + spark(.63, .08, 5);
}

function frontIndex() { return ((Math.round(-theta / STEP) % N) + N) % N; }

function render() {
  for (let i = 0; i < N; i++) {
    const a = theta + i * STEP;
    const s = Math.sin(a), c = Math.cos(a);
    const d = (c + 1) / 2;                         // depth: 1 = front, 0 = back
    const x = geom.cx + geom.rx * s, y = geom.cy + geom.ry * c;
    const sc = 0.68 + 0.37 * d;
    const p = planets[i];
    p.el.style.transform = `translate3d(${x - p.w / 2}px, ${y - p.g / 2}px, 0) scale(${sc})`;
    p.el.style.zIndex = Math.round(d * 100);
    p.el.style.opacity = (0.62 + 0.38 * d).toFixed(3);
    if (p.spoke) {                                  // spoke from the logo's edge to the planet
      const dx = x - geom.cx, dy = y - geom.cy, len = Math.hypot(dx, dy) || 1, r0 = geom.g * 0.95;
      p.spoke.setAttribute('x1', geom.cx + dx / len * r0); p.spoke.setAttribute('y1', geom.cy + dy / len * r0);
      p.spoke.setAttribute('x2', x); p.spoke.setAttribute('y2', y);
      p.spoke.setAttribute('opacity', (0.25 + 0.6 * d).toFixed(2));
    }
  }
  const f = frontIndex();
  planets.forEach((p, i) => p.el.classList.toggle('front', i === f));
  $('hint').textContent = `${ACTIVITIES[f].label}  ·  ${f + 1} of ${N}`;
}

function stopAnim() { if (anim) cancelAnimationFrame(anim); anim = null; }

function animateTo(target, dur = 450, done) {
  stopAnim();
  const start = theta, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3);
  const tick = now => {
    const t = Math.min(1, (now - t0) / dur);
    theta = start + (target - start) * ease(t);
    render();
    if (t < 1) anim = requestAnimationFrame(tick);
    else { anim = null; done && done(); }
  };
  anim = requestAnimationFrame(tick);
}
function snap(done) { animateTo(Math.round(theta / STEP) * STEP, 380, done); }
function rotateBy(n) { animateTo(Math.round(theta / STEP) * STEP - n * STEP, 450); }
// bring item i to front by the shortest route
function bringToFront(i, done) {
  let target = -i * STEP;
  target += TAU * Math.round((theta - target) / TAU);
  animateTo(target, 500, done);
}
function inertia(v) {               // v in rad/ms
  stopAnim();
  let last = performance.now();
  const tick = now => {
    const dt = Math.min(32, now - last); last = now;
    theta += v * dt;
    v *= Math.pow(0.994, dt);
    render();
    if (Math.abs(v) > 0.00025) anim = requestAnimationFrame(tick);
    else { anim = null; snap(); }
  };
  anim = requestAnimationFrame(tick);
}

/* drag / swipe / tap */
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  markActive(); stopAnim();      // markActive may start a snap; stopAnim cancels it so the drag takes over
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, xLast: e.clientX, tLast: performance.now(),
           t0: performance.now(), theta0: theta, moved: 0, v: 0,
           target: e.target.closest('.planet') };
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0;
  drag.moved = Math.max(drag.moved, Math.hypot(dx, e.clientY - drag.y0));
  if (drag.moved > 8) stage.classList.add('dragging');
  const now = performance.now(), dt = now - drag.tLast;
  if (dt > 0) { const v = (e.clientX - drag.xLast) / geom.rx / dt; drag.v = 0.6 * v + 0.4 * drag.v; }
  drag.xLast = e.clientX; drag.tLast = now;
  theta = drag.theta0 + dx / geom.rx;
  render();
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  stage.classList.remove('dragging');
  const isTap = !cancelled && d.moved < 10 && performance.now() - d.t0 < 600;
  if (isTap && d.target) {
    const i = +d.target.dataset.index;
    if (i === frontIndex() && Math.abs(theta - Math.round(theta / STEP) * STEP) < 0.05) openFlyer(i);
    else bringToFront(i, () => openFlyer(i));
    return;
  }
  // ignore stale velocity if finger rested before release
  const v = performance.now() - d.tLast > 80 ? 0 : d.v;
  if (Math.abs(v) > 0.0006) inertia(Math.max(-0.02, Math.min(0.02, v)));
  else snap();
}
stage.addEventListener('pointerup', e => endDrag(e, false));
stage.addEventListener('pointercancel', e => endDrag(e, true));
stage.addEventListener('wheel', e => {            // trackpad / mouse wheel on laptops
  e.preventDefault(); markActive(); stopAnim();
  theta -= (e.deltaX || e.deltaY) / geom.rx; render();
  clearTimeout(stage._wheelT); stage._wheelT = setTimeout(snap, 140);
}, { passive: false });

$('prevBtn').onclick = () => { markActive(); rotateBy(-1); };
$('nextBtn').onclick = () => { markActive(); rotateBy(1); };
document.addEventListener('keydown', e => {
  markActive();
  if (anyOverlayOpen()) { if (e.key === 'Escape') goHome(false); return; }
  if (e.key === 'ArrowRight') rotateBy(1);
  else if (e.key === 'ArrowLeft') rotateBy(-1);
  else if (e.key === 'Enter' && !e.target.closest('button')) openFlyer(frontIndex());
});
window.addEventListener('resize', layout);

function showOverlay(id) { overlayOpenedAt = performance.now(); overlays.forEach(o => $(o).classList.toggle('open', o === id)); }

        ${a.getInvolved ? `<h3 class="gi">Get involved</h3><ul>${a.getInvolved.map(p => `<li>${md(p, linkMode())}</li>`).join('')}</ul>` : ''}

        <button class="pill ${inB ? 'primary' : ''}" data-basket ${basket.size ? '' : 'disabled'}>Email my flyers (${basket.size})</button>

}

function openBasket() {
  markActive();
  const list = $('basketList');
  const items = ACTIVITIES.filter(a => basket.has(a.id));
  list.innerHTML = items.length
    ? items.map(a => `<li style="--c:${a.c}"><span class="dot"></span><span class="t">${esc(a.title)}</span><button type="button" data-remove="${esc(a.id)}" aria-label="Remove ${esc(a.title)}">✕</button></li>`).join('')
    : '<li><span class="t">No flyers yet. Tap a planet, then “Add to my flyers”.</span></li>';
  $('sendError').textContent = '';
  updateSendState();
  showOverlay('basketOverlay');
}

function goHome(reset) {
  closeOverlays();
  if (reset) {
    basket.clear(); updateBasketUI(false);
    $('email').value = ''; $('consent').checked = false; $('website').value = '';
    animateTo(Math.round(theta / TAU) * TAU, 600);  // back to first planet
  }
  if (document.activeElement) document.activeElement.blur();
}

// delegated clicks inside overlays
document.addEventListener('click', e => {
  const t = e.target.closest('[data-home],[data-basket],[data-toggle],[data-remove]');
  if (!t) {
    // tap anywhere outside the open box (backdrop or header background) goes home.
    // Ignore the click that belongs to the tap which just opened the box.
    if (anyOverlayOpen() && performance.now() - overlayOpenedAt > 400 &&
        !e.target.closest('.panel') && !e.target.closest('.hdr-actions')) {
      markActive();
      goHome($('doneOverlay').classList.contains('open'));
    }
    return;
  }
  markActive();
  if (t.hasAttribute('data-home')) goHome($('doneOverlay').classList.contains('open'));
  else if (t.hasAttribute('data-basket')) openBasket();
  else if (t.dataset.toggle) { toggleBasket(t.dataset.toggle); openFlyer(ACTIVITIES.findIndex(a => a.id === t.dataset.toggle)); }
  else if (t.dataset.remove) { basket.delete(t.dataset.remove); updateBasketUI(false); openBasket(); }
});
$('homeBtn').onclick = () => { markActive(); goHome(false); };
$('basketBtn').onclick = () => openBasket();

/* =====================================================================
   SENDING
   ===================================================================== */
$('consentText').textContent = CONFIG.CONSENT_TEXT;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
let lastSend = 0;
function updateSendState() {
  const ok = basket.size > 0 && EMAIL_RE.test($('email').value.trim()) && $('consent').checked;
  $('sendBtn').disabled = !ok;
}
$('email').addEventListener('input', () => { markActive(); updateSendState(); });
$('consent').addEventListener('change', () => { markActive(); updateSendState(); });

$('sendForm').addEventListener('submit', async e => {
  e.preventDefault(); markActive();
  const email = $('email').value.trim();
  const ids = ACTIVITIES.filter(a => basket.has(a.id)).map(a => a.id);
  if (!ids.length) return ($('sendError').textContent = 'Add at least one flyer first.');
  if (!EMAIL_RE.test(email)) return ($('sendError').textContent = 'Please check the email address.');
  if (!$('consent').checked) return ($('sendError').textContent = 'Please tick the box to continue.');
  if (Date.now() - lastSend < CONFIG.SEND_COOLDOWN_MS) return ($('sendError').textContent = 'One moment, please try again in a few seconds.');
  lastSend = Date.now();
  const payload = { email, ids, website: $('website').value };   // website = honeypot

  if (!CONFIG.MAILER_URL) {                                        // DEMO MODE
    showDone('Demo mode: no email sent',
      `Set CONFIG.MAILER_URL to send for real. This is roughly what ${email} would receive:`,
      buildEmailHtml(ids));
    return;
  }
  $('sendBtn').disabled = true; $('sendError').textContent = 'Sending…';
  try {
    await postToMailer(payload);
    showDone('Sent!', 'Check your inbox in a minute or two (and your spam folder, just in case).');
  } catch (err) {
    if (err.offline) {
      queuePush(payload);
      showDone('Saved, will send shortly', 'The kiosk is offline right now. Your email will go out as soon as the connection is back.');
    } else if (err.message === 'closed' || err.message === 'quota') {
      // outside the forum send window, or daily cap reached
      showDone('Email isn’t available right now',
        `You can find everything on these flyers at ${CONFIG.SITE_URL.replace(/^https?:\/\//, '')}.`);
    } else {
      $('sendError').textContent = err.message === 'recently_sent'
        ? 'We sent flyers to this address a few minutes ago. Please check your inbox.'
        : 'Sorry, that didn’t work. Please check the address and try again.';
      updateSendState();
    }
  }
});

async function postToMailer(payload) {
  let res;
  try {
    // text/plain avoids a CORS preflight, which Apps Script does not answer
    res = await fetch(CONFIG.MAILER_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  } catch (_) { const e = new Error('offline'); e.offline = true; throw e; }
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok || !data.ok) throw new Error(data.error || 'server');
}

/* offline queue (localStorage). Entries are deleted as soon as they send. */
const QKEY = 'oadKioskQueue';
const queueGet = () => { try { return JSON.parse(localStorage.getItem(QKEY)) || []; } catch (_) { return []; } };
const queueSet = q => { localStorage.setItem(QKEY, JSON.stringify(q)); renderQueueBadge(); };
function queuePush(p) { const q = queueGet(); q.push({ ...p, ts: Date.now() }); queueSet(q); }
function renderQueueBadge() {
  const n = queueGet().length, b = $('queueBadge');
  b.style.display = n ? 'inline' : 'none';
  b.textContent = n ? `⏳ ${n} waiting to send` : '';
}
let flushing = false;
async function flushQueue() {
  if (flushing || !CONFIG.MAILER_URL || !navigator.onLine) return;
  flushing = true;
  try {
    let q = queueGet();
    while (q.length) {
      const item = q[0];
      try { await postToMailer(item); }
      catch (err) { if (err.offline) break; /* server rejected: drop it */ }
      q = queueGet(); q.shift(); queueSet(q);
    }
  } finally { flushing = false; }
}
window.addEventListener('online', flushQueue);
setInterval(flushQueue, 60 * 1000);

function showDone(title, msg, previewHtml) {
  $('doneTitle').textContent = title;
  $('doneMsg').textContent = msg;
  const pv = $('donePreview');
  pv.innerHTML = '';
  if (previewHtml) {
    const f = document.createElement('iframe');
    f.className = 'preview'; f.setAttribute('sandbox', ''); f.srcdoc = previewHtml; f.title = 'Email preview';
    pv.appendChild(f);
  }
  showOverlay('doneOverlay');
  // clear personal data immediately; auto-return to start
  $('email').value = ''; $('consent').checked = false;
  basket.clear(); updateBasketUI(false);
  clearTimeout(showDone._t);
  showDone._t = setTimeout(() => { if ($('doneOverlay').classList.contains('open')) goHome(true); }, previewHtml ? 60000 : 10000);
}

      <p style="margin:0 0 10px">${md(a.summary, 'a', LS)}</p>

      ${a.getInvolved ? `<p style="margin:0 0 4px;font-weight:bold;color:#1e3551">Get involved</p><ul style="margin:0 0 10px;padding-left:20px">${a.getInvolved.map(li).join('')}</ul>` : ''}
      <p style="margin:0">${link(a.link || CONFIG.SITE_URL, 'Read more →')}</p>

  return `<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#f5efe6;font-family:Arial,Helvetica,sans-serif;color:#222;line-height:1.45">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#fff;border-radius:12px;overflow:hidden">
    <tr><td style="background:#1e3551;color:#fff;padding:24px"><div style="font-size:28px;font-weight:800">OAD</div>

      <p style="margin:0 0 8px;font-size:16px"><strong>Stay in touch:</strong> ${link(CONFIG.MAILING_LIST_URL, 'join our mailing list')} or ${link(CONFIG.DISCORD_URL, 'join our Discord')}.</p>
    </td></tr>
    <tr><td style="padding:16px 24px;background:#f5efe6;font-size:12px;color:#666">
      You received this one-off email because you asked for it at our stand. We have not added you to any mailing list.
      ${CONFIG.PRIVACY_URL ? ' ' + link(CONFIG.PRIVACY_URL, 'Privacy notice') : ''}
    </td></tr>
  </table></td></tr></table></body></html>`;
}

/* =====================================================================
   IDLE: attract mode + auto-reset
   ===================================================================== */
let lastActive = Date.now(), attract = null;
function markActive() {
  lastActive = Date.now();
  if (attract) { cancelAnimationFrame(attract); attract = null; snap(); }
}
['pointerdown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true }));
function startAttract() {
  let last = performance.now();
  const tick = now => {
    const dt = Math.min(50, now - last); last = now;
    theta -= 0.00012 * dt; render();
    attract = requestAnimationFrame(tick);
  };
  attract = requestAnimationFrame(tick);
}
setInterval(() => {
  const idle = Date.now() - lastActive;
  if (anyOverlayOpen()) {
    if (idle > CONFIG.IDLE_RESET_MS) { lastActive = Date.now(); goHome(true); }
  } else if (!attract && !anim && !drag && idle > CONFIG.ATTRACT_AFTER_MS) {
    if (basket.size && idle > CONFIG.IDLE_RESET_MS) { basket.clear(); updateBasketUI(false); }
    startAttract();
  }
}, 1000);

/* screen wake lock (keeps tablet awake where supported) */
async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch (_) {} }
